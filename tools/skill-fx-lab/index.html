<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>血脈の系譜 — 技のエフェクト工房</title>
<style>/*__STYLE__*/</style></head><body>
<main>
 <header><a class="brand" href="#" aria-label="血脈の系譜 エフェクト工房"><span class="crest">血</span><span>血脈の系譜<small>BLOODLINE LEGACY</small></span></a><span class="edition">技のエフェクト工房 <b>01</b></span></header>
 <div class="intro"><div><span class="eyebrow">SKILL EFFECT STUDY</span><h1>技の表情を、組み替える。</h1></div><p>形、軌道、拍子、その余韻。<br>6つの見本から、気になる一手を。</p></div>
 <div class="workspace">
  <section class="viewer" aria-label="エフェクト再生">
   <div class="stage-title"><div><span id="family-label">斬面</span><h2 id="effect-name">薄月</h2></div><button id="replay" class="small">↻ もう一度 <kbd>Space</kbd></button></div>
   <div class="canvas-wrap"><canvas id="stage" aria-label="キャラクターから稽古人形へ技を放つ演出見本"></canvas><div class="stage-tags"><span id="phase">構え</span><span id="mode-label">演出見本</span></div></div>
   <div class="transport">
    <button id="play" class="play" aria-label="一時停止">Ⅱ</button>
    <div class="timeline"><label for="timeline" class="sr-only">再生位置</label><input id="timeline" type="range" min="0" max="1500" step="1" value="0"><div id="beat-marks" aria-hidden="true"></div></div>
    <button id="step" class="small" aria-label="1コマ進める">+1f</button>
    <label class="speed"><span class="sr-only">再生速度</span><select id="speed"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option></select></label>
   </div>
   <div class="view-options"><label><input type="checkbox" id="loop" checked> 繰り返す</label><label><input type="checkbox" id="surface-compare" checked> 基準と比較</label><select id="baseline" aria-label="比較する基準"><option value="thin">揺れなし・薄め</option><option value="legacy">初期の斬面</option></select><label><input type="checkbox" id="mono"> 白黒で比較</label><label><input type="checkbox" id="sound"> 音を聴く</label></div>
   <div class="caption"><span class="caption-mark">↗</span><p id="description"></p></div>
   <div class="compare-row"><button id="pin">いまの構成をAに記録</button><button id="compare" disabled aria-pressed="false">A / B を並べる</button><span id="pin-label">組み替え前を残して比較</span></div>
  </section>
  <aside class="composer" aria-label="エフェクトの組み替え">
   <div class="section-title"><span>01</span><h3>見本から選ぶ</h3><button id="reset" class="text-button">見本に戻す</button></div>
   <div id="presets" class="presets"></div>
   <div class="section-title"><span>02</span><h3>組み替える</h3><button id="shuffle" class="text-button">おまかせ ↗</button></div>
   <div class="fields">
    <label class="full">技の質感<select id="family"></select></label>
    <label>走る軌道<select id="path"></select></label><label>打撃の拍子<select id="rhythm"></select></label>
    <label>命中の形<select id="impact"></select></label><label>消え際<select id="release"></select></label>
   </div>
   <fieldset class="silk-controls" id="silk-controls"><legend>斬面の調整</legend>
    <label for="thickness">厚み <output id="thickness-value" for="thickness">2.2×</output></label><input id="thickness" type="range" min=".5" max="3" step=".1" value="2.2">
    <label for="flutter">揺らめきの強さ <output id="flutter-value" for="flutter">65%</output></label><input id="flutter" type="range" min="0" max="1" step=".05" value=".65">
    <button id="reseed" class="small">揺れ方を変える ↻</button><p>0%で揺れを止められます。厚みと揺れ方も構成に保存されます。</p>
   </fieldset>
   <p class="field-note">項目を変えるとすぐに再生。色の変更はありません。</p>
   <div class="recipe-box"><span>いまの構成</span><p id="recipe-text"></p></div>
   <div class="file-actions"><button id="export">構成を保存 ↓</button><button id="import">構成を読込 ↑</button><input id="file" type="file" accept=".json,application/json" hidden></div>
   <p id="notice" role="status" aria-live="polite"></p>
  </aside>
 </div>
 <footer><span>動きの違いを試す、独立した演出見本。本編の習得・威力・保存には影響しません。</span><span>OFFLINE READY · <b id="build-id">LOCAL</b></span></footer>
</main><script>/*__SCRIPT__*/</script></body></html>
