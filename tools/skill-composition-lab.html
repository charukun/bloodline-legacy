<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>血脈の系譜 · 技の稽古帳</title>
<style>
[hidden]{display:none!important}button:disabled,fieldset:disabled{opacity:.5}button:disabled{cursor:default}#fx-summary{border-top:1px solid #727b6344;padding-top:10px}#readout{font-size:12px}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#252e30;color:#ede6d0;font:14px system-ui}body{display:grid;grid-template-columns:minmax(0,1fr) 360px}#stage{position:relative;min-width:0;min-height:0}canvas{display:block;width:100%;height:100%;touch-action:none}#loading{position:absolute;inset:40% 10%;text-align:center}#readout{position:absolute;left:20px;bottom:18px;pointer-events:none;background:#26332ddd;padding:12px 16px;border-left:2px solid #dec68b;max-width:90%;line-height:1.6}aside{overflow:auto;padding:22px;background:linear-gradient(145deg,#34423d,#212c2b);border-left:1px solid #777356}h1{font:22px serif;margin:0 0 6px}p{line-height:1.7;color:#c4c9b9;font-size:12px}label{display:block;margin-top:13px;color:#d2d6bf;font-size:12px}select,button,textarea,input{font:inherit}select,textarea{width:100%;padding:9px;background:#1e2b29;color:#f0e8d1;border:1px solid #687569;border-radius:4px}button{padding:9px 11px;border:1px solid #8c8c6b;background:#384b40;color:#f6edcf;border-radius:4px;cursor:pointer}button:hover{background:#53644b}.row{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.row>*{flex:1}.major{background:#c8b680;color:#22322b;border-color:#e6d8ad}#description{min-height:95px}#name{font:19px serif;color:#fff0c4;margin:18px 0 5px}small{color:#b5bda9}input[type=range]{width:100%}textarea{height:72px;font:11px monospace}details{margin-top:18px}#slots button{font-size:11px;min-width:85px;flex-basis:28%;line-height:1.6}#slots .selected{outline:2px solid #e2c780}#error{color:#f4ac9b}input[type=checkbox]{vertical-align:middle}@media(orientation:portrait){body{grid-template-columns:1fr;grid-template-rows:43% 57%}aside{padding:15px 20px;border-left:0;border-top:1px solid #777356}h1{font-size:18px}.parts{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}#description{min-height:0}#readout{left:10px;bottom:8px;font-size:11px;padding:6px 10px}}
</style><div id="stage"><canvas id="world"></canvas><div id="loading">稽古場を準備しています…</div><div id="readout" aria-live="polite">技を組み替えて「一技を試す」</div></div>
<aside><h1>技の稽古帳</h1><small>血脈の系譜 · 構成式スキル</small><p>打ち方と拍子、足運びを変えて、同じ相手への届き方を試す。</p>
<div class="row"><button id="random" class="major">技を閃く</button><button id="previous" disabled>前の技</button></div>
<button id="flow" class="major">意識で連続戦闘</button><label><input id="rhythm" type="checkbox"> 約1秒の拍子で技を閃く</label><p>連続戦闘では、閃いた技が次の行動候補に加わります。各段3技まで同じ重みで選択。位置・負傷・戦況を保って戦います。武器・相手・距離の変更は新しい試行になります。</p><p id="flow-pool"></p><div class="row"><button id="flame">煤火の剣</button><button id="lightning">雷渡り</button></div>
<label>持つ武器<select id="weapon"><option value="-1">素手</option><option value="0">片手剣</option><option value="1">短剣</option><option value="2">大剣</option><option value="3">槍</option><option value="4">戦斧</option><option value="5">杖</option></select></label>
<label id="weapon-choice" hidden>この武器の技<select id="weapon-skill"></select></label>
<label>構成技の見本<select id="preset"></select></label><fieldset id="parts" class="parts" style="border:0;padding:0;margin:0"></fieldset>
<div id="name"></div><small id="name-en" lang="en"></small><p id="phase"></p><p id="description"></p><small id="connection"></small>
<p id="equipment-note"></p><p id="fx-summary"></p><label><input id="effects" type="checkbox" checked> 技のエフェクトを表示</label>
<div class="row"><button id="cast" class="major">一技を試す</button><button id="combo">序破急を試す</button><button id="ready">構えを試す</button><button id="pause">一時停止</button></div>
<div id="slots" class="row"></div><div class="row"><button id="adopt">この技を編成に入れる</button><button id="random-combo">序破急を抽選</button></div>
<label>相手<select id="target"><option value="dummy">かかし</option><option value="crawler">鎌脚の蟲</option><option value="soldier">盾持ちの異形</option><option value="crowd">かかし三体</option></select></label>
<label>開始距離 <output id="distanceText">2.5</output><input id="distance" type="range" min="1" max="5" step=".1" value="2.5"></label><button id="fit-distance">この技の間合いに合わせる</button>
<div class="row"><label>再生速度<select id="speed"><option value="1">通常</option><option value=".5">半速</option><option value=".25">ゆっくり</option></select></label><label>カメラ<select id="view"><option value=".85">斜め</option><option value="1.57">横</option><option value="0">正面</option></select></label></div>
<label><input id="repeat" type="checkbox" checked> 同じ条件で繰り返す（連続戦闘は20秒ごと）</label>
<label><input id="follow-camera" type="checkbox"> カメラを追従させる</label>
<details><summary>構成を保存・読み込み</summary><p>この稽古帳だけに保存します。本編のセーブには触れません。</p><textarea id="recipe" aria-label="技の構成JSON"></textarea><div class="row"><button id="save">保存</button><button id="load">読み込む</button></div></details><p id="error" role="status"></p><p id="build"></p>
</aside><script>/*__SCRIPT__*/</script></html>
