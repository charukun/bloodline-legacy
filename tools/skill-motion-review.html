<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>血脈の系譜 — モーション比較</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#262d29;color:#eee7d8;font:15px/1.5 system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}header{padding:12px 18px 8px;display:flex;gap:12px;align-items:center;justify-content:space-between}h1{font-size:17px;margin:0}small{color:#c3beab;font-size:12px}main{position:relative;flex:1;min-height:180px;background:radial-gradient(ellipse at 50% 70%,#737b6a,#303b38)}iframe{width:100%;height:100%;border:0;display:block}#status{position:absolute;top:14px;left:18px;pointer-events:none;padding:5px 12px;background:#252b26d9;border-radius:6px;color:#eddfbf}#version{color:#d9ba78}footer{padding:12px max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom));background:#30362e;border-top:1px solid #77745c}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row+.row{margin-top:10px}button,select{min-height:42px;border:1px solid #827759;border-radius:7px;background:#444938;color:#eee7d8;font:inherit;padding:8px 12px}button[aria-pressed=true]{background:#d5bd84;color:#282f27;border-color:#e2cb98}label{display:flex;gap:6px;align-items:center}input[type=range]{flex:1;min-width:80px;accent-color:#d5bd84}input[type=checkbox]{width:20px;height:20px;accent-color:#d5bd84}#pause{min-width:80px}.hint{margin:9px 0 0;font-size:12px;color:#b7b6a5}@media(max-width:480px){header{padding:8px 12px}h1{font-size:15px}small{font-size:10px}footer{padding-top:8px}.row{gap:6px}.row+.row{margin-top:7px}button,select{font-size:13px;padding:7px 9px}label{font-size:13px}.hint{font-size:11px}}@media(orientation:landscape) and (max-height:550px){body{display:grid;grid-template-columns:1fr 300px;grid-template-rows:45px 1fr}header{grid-column:1/3}main{grid-column:1}footer{grid-column:2;grid-row:2;border-top:0;border-left:1px solid #77745c;overflow:auto}.row{gap:6px}.row+.row{margin-top:12px}.hint{line-height:1.5}}
</style>
<header><h1>血脈の系譜 <small>モーション比較</small></h1><small id="version">改善後</small></header>
<main><iframe title="スキルモーション" sandbox="allow-scripts"></iframe><output id="status" aria-live="polite">準備中…</output></main>
<footer>
<div class="row"><button data-version="after" aria-pressed="true">改善後</button><button data-version="before" aria-pressed="false">変更前</button><label>技<select id="clip"><option value="golden">片手剣：接近 → 3連撃 → 復帰</option><option value="slash">斬撃</option><option value="thrust">突き</option><option value="slam">重打</option><option value="kick">蹴り</option><option value="spin">回転</option><option value="cast">詠唱</option><option value="chain">序 → 破 → 急</option></select></label></div>
<div class="row"><button id="pause">一時停止</button><label>速度<select id="speed"><option value="1">通常</option><option value="0.25">¼ スロー</option></select></label><label><input id="fx" type="checkbox">エフェクト</label></div>
<div class="row"><label>体格<select id="age"><option value="24">成人</option><option value="14">14歳</option></select></label><label>視点<select id="angle"><option value="0.9">斜め</option><option value="0">正面</option><option value="1.5708">横</option></select></label><label>距離<select id="view"><option value="close">近く</option><option value="game">ゲーム</option></select></label></div>
<div class="row"><input id="seek" aria-label="再生位置" type="range" min="0" max="1000" value="0"><button id="restart">最初から</button></div>
<p class="hint">代表改修は成人男性の片手剣です。比較用の動作列（衝突なし）を、変更前後のモデル・モーションで再生します。実戦の録画ではありません。</p>
</footer>
<script>
'use strict';
const PAYLOAD=/*__PAYLOAD__*/;
const frame=document.querySelector('iframe'),status=document.getElementById('status'),seek=document.getElementById('seek');
const config={clip:'golden',age:24,speed:1,paused:false,fx:false,view:'close',angle:.9};let version='after',progress=0,ready=false,switchId=0;
const send=data=>{if(ready)frame.contentWindow.postMessage({type:'motion-control',...data},'*');};
function documentFor(mode){let code=PAYLOAD.code.replace('__MOTION_REVIEW_SESSION__',String(switchId));if(mode==='before')for(const [file,source]of Object.entries(PAYLOAD.before)){const marker='// SOURCE MODULE: '+file+'\n',start=code.indexOf(marker),end=code.indexOf('// SOURCE MODULE:',start+marker.length);if(start<0||end<0)throw Error('比較元が見つかりません: '+file);code=code.slice(0,start)+marker+source+'\n\n'+code.slice(end);}if(mode==='before')code=code.replace('// SOURCE MODULE: legacy/dialogue.js',()=>`VISUAL_ASSETS['character/young-human-male-cm01.glb']=${JSON.stringify(PAYLOAD.beforeAsset)};\n// SOURCE MODULE: legacy/dialogue.js`);return '<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#687363}canvas{width:100%;height:100%;display:block}#loading{position:absolute;inset:40% 10%;color:white;text-align:center;font:15px system-ui}</style><canvas id="world"></canvas><div id="loading">キャラクターを準備しています…</div><script>'+code.replace(/<\/script/gi,'<\\/script')+'<\/script></html>';}
function load(mode){send({dispose:true});ready=false;status.textContent='準備中…';version=mode;document.querySelectorAll('[data-version]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.version===mode)));document.getElementById('version').textContent=(mode==='after'?'改善後 · ':'変更前 · ')+PAYLOAD[mode+'Sha'].slice(0,7);const id=++switchId;setTimeout(()=>{if(id===switchId)frame.srcdoc=documentFor(mode);},0);}
addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.data?.type!=='motion-review'||e.data.session!==switchId)return;const d=e.data;if(d.ready){ready=true;send({config,seek:progress});}if(d.error)status.textContent='表示できませんでした: '+d.error;if(Number.isFinite(d.progress)){progress=d.progress;seek.value=String(Math.round(progress*1000));status.textContent=[d.skill,d.label].filter(Boolean).join(' · ');}});
document.querySelectorAll('[data-version]').forEach(b=>b.addEventListener('click',()=>{if(version!==b.dataset.version)load(b.dataset.version);}));
for(const id of ['clip','age','speed','fx','view','angle'])document.getElementById(id).addEventListener('change',e=>{config[id]=id==='fx'?e.target.checked:['age','speed','angle'].includes(id)?Number(e.target.value):e.target.value;if(id==='clip'||id==='age')progress=0;send({config});});
const pause=document.getElementById('pause');pause.addEventListener('click',()=>{config.paused=!config.paused;pause.textContent=config.paused?'再生':'一時停止';send({config});});
seek.addEventListener('input',()=>{progress=Number(seek.value)/1000;config.paused=true;pause.textContent='再生';send({config,seek:progress});});
document.getElementById('restart').addEventListener('click',()=>{progress=0;send({seek:0});});load(version);
</script></html>
