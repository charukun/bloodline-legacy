<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>血脈の系譜 · Review Lab</title><link rel="stylesheet" href="/review/style.css"></head>
<body><header><div><span class="eyebrow">BLOODLINE LEGACY / DEVELOPER</span><h1>Review Lab <span>稽古と観察の間</span></h1></div><nav aria-label="確認する対象"><a data-mode="skills" href="/review/skills">技</a><a data-mode="enemies" href="/review/enemies">敵</a><a data-mode="combat" href="/review/combat">技 × 敵</a></nav><output id="build">版を確認中…</output></header>
<main><section id="stage" aria-label="実装確認の画面"><canvas id="world"></canvas><div id="loading">稽古場を準備しています…</div><div id="caption"><h2 id="title">実装を読み込み中</h2><p id="readout" role="status"></p></div><output id="stats"></output></section>
<aside><div class="section-head"><h2 id="mode-title">技を選ぶ</h2><button id="copy" title="この対象とcommitを直接開くURL">URLをコピー</button></div><p id="error" role="alert"></p>
<div id="skill-controls"><label>技を探す<input id="search" type="search" placeholder="名前・ID・構成で検索"></label><label>技<select id="skill"></select></label><p id="description"></p><div class="pair"><label>武器<select id="weapon"></select></label><label>エフェクト<input id="effects" type="checkbox" checked></label></div><details id="composition"><summary>構成技を組み替える</summary><div id="parts" class="pair"></div></details><details><summary>序破急の編成</summary><div id="slots"></div><button id="adopt">選択中の技を編成</button></details><div class="actions"><button id="single" class="primary">単発</button><button id="combo">序破急</button><button id="combat">実戦</button></div><div class="actions"><button id="random">技を閃く</button><button id="previous" disabled>前の技</button></div></div>
<label>相手<select id="enemy"></select></label><div id="distance-control"><label>間合い <output id="distance-value">2.5</output><input id="distance" type="range" min=".8" max="15" step=".1" value="2.5"></label><button id="fit">技の間合いに合わせる</button></div>
<div id="enemy-controls" hidden><label>動作<select id="pose"><option value="sequence">一通り再生</option><option value="idle">待機</option><option value="run">移動</option><option value="windup">攻撃予兆</option><option value="strike">攻撃</option><option value="attack">予兆 → 攻撃</option><option value="guard">防御</option><option value="hit">被弾</option><option value="death">死亡</option></select></label><label>生命力 <output id="vitality-value">100%</output><input id="vitality" type="range" min="0" max="100" value="100"></label><label>部位欠損<select id="broken"><option value="none">なし</option><option value="rightArm">右腕・前脚</option><option value="leftArm">左腕・前脚</option><option value="rightLeg">右脚・後脚</option><option value="leftLeg">左脚・後脚</option><option value="bothLegs">両脚・後脚</option><option value="bothArms">両腕・前脚</option><option value="rightArmLeftLeg">右腕＋左脚</option></select></label><label>再生位置<input id="seek" type="range" min="0" max="999" value="0"></label><label>表示数<select id="count"><option>1</option><option>2</option><option>8</option><option>24</option></select></label></div>
<div class="pair"><label>速度<select id="speed"><option value="1">通常</option><option value=".5">½</option><option value=".25">¼</option><option value="2">2倍</option></select></label><label>視点<select id="view"><option value=".85">斜め</option><option value="0">正面</option><option value="1.57">横</option><option value="3.14">背面</option></select></label></div><div class="pair"><label>品質<select id="quality"><option value="medium">中</option><option value="low">低</option><option value="high">高</option></select></label><label><input id="follow" type="checkbox" checked> カメラ追従</label></div><label><input id="repeat" type="checkbox" checked> 同じ条件で連続確認</label><div class="actions"><button id="pause">一時停止</button><button id="restart">最初から</button></div><details><summary>負荷計測</summary><p>準備10秒＋10秒×3回。実行端末のフレーム間隔と描画負荷を記録します。</p><button id="measure">40秒計測してJSON保存</button><output id="measurement"></output></details><p class="note" id="isolation">本編のセーブは読み書きしません。試行はこの画面の中だけで完結します。</p><code id="sha"></code></aside></main><script type="module" src="/review/app.mjs"></script></body></html>
