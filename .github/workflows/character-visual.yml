name: Character visual verification
on:
  workflow_dispatch:
    inputs:
      full_review:
        description: Run the full visual and software performance comparison
        type: boolean
        default: false
  push:
    branches: ['work/character-golden-master-*']
  pull_request:
    branches: [develop]
    paths:
      - 'src/character/**'
      - 'public/assets/character/**'
      - 'tests/character*'
      - 'tools/generate_character.py'
      - '.github/workflows/character-visual.yml'
permissions:
  contents: read
concurrency:
  group: character-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  character:
    name: Character build, input and visual evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare native GLSL ES validation
        run: |
          if ! python3 -c "import ctypes; ctypes.CDLL('libEGL.so.1'); ctypes.CDLL('libEGL_mesa.so.0')"; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0
          fi
      - run: npm test
      - run: node build.mjs
      - name: Validate character assets
        run: |
          python -m pip install -r tools/requirements-character.txt
          python tests/character_asset_validation.py
      - run: npm ci --prefix deploy --ignore-scripts --no-audit --no-fund
      - run: deploy/node_modules/.bin/playwright install --with-deps chromium
      - name: Build the pull request implementation baseline
        env:
          CHARACTER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '717931fd92271104b89a9c5645ed4792bbf06c2e' }}
        run: |
          git worktree add --detach /tmp/character-baseline "$CHARACTER_BASE_SHA"
          node /tmp/character-baseline/build.mjs
      - name: Verify character input, equipment and save integration
        # Software rendering of the integrated village needs several seconds
        # per frame; retain the complete functional coverage and evidence.
        timeout-minutes: 35
        env:
          CHARACTER_BASELINE: /tmp/character-baseline/dist/index.html
          CHARACTER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '717931fd92271104b89a9c5645ed4792bbf06c2e' }}
          CHARACTER_MODE: functional
          CHARACTER_AFTER_ONLY: '1'
        run: node tests/character-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-functional-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/current/
          if-no-files-found: error
          retention-days: 30
      - name: Compare sustained performance on the same runner
        if: inputs.full_review == true
        timeout-minutes: 22
        env:
          CHARACTER_BASELINE: /tmp/character-baseline/dist/index.html
          CHARACTER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '717931fd92271104b89a9c5645ed4792bbf06c2e' }}
          CHARACTER_MODE: performance
        run: node tests/character-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/current/
          if-no-files-found: error
          retention-days: 30
