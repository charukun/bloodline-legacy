name: Ship deck verification
on:
  push:
    branches: ['work/ship-deck-*']
  pull_request:
    branches: [develop]
    paths:
      - 'src/legacy/core.js'
      - 'src/legacy/art.js'
      - 'src/legacy/ui.js'
      - 'src/render/renderer-base.js'
      - 'tests/ship-*'
      - '.github/workflows/ship-deck.yml'
permissions:
  contents: read
concurrency:
  group: ship-deck-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/ship-*.test.mjs tests/traversal.test.mjs tests/live-update.test.mjs tests/world-actions.test.mjs
      - run: npm ci --prefix deploy --ignore-scripts --no-audit --no-fund
      - name: Install and verify Chromium
        run: |
          deploy/node_modules/.bin/playwright install chromium
          # Hosted runners may already have the required native libraries.
          # Probe the actual browser before requesting an OS dependency refresh.
          if ! node --input-type=module -e "import {chromium} from './deploy/node_modules/playwright/index.mjs'; const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']}); await browser.close();"; then
            deploy/node_modules/.bin/playwright install-deps chromium
          fi
      - name: Verify physical boarding, deck actions, saved departure and WebGL
        run: node tests/ship-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ship-deck-${{ github.run_id }}
          path: verification/current/ship/
          if-no-files-found: error
          retention-days: 30
