name: Tidebreak Public Preview

on:
  push:
    branches:
      - review/tidebreak-current-preview-20260918

permissions:
  contents: read

concurrency:
  group: tidebreak-public-preview
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'charukun/bloodline-legacy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the existing combat Review app
        env:
          REVIEW_ENV: local
          REVIEW_SHA: ${{ github.sha }}
        run: node tools/build-review-lab.mjs
      - name: Verify desktop and mobile interaction
        env:
          REVIEW_SHA: ${{ github.sha }}
        run: |
          npm ci --prefix deploy --ignore-scripts --no-audit --no-fund
          bash tools/ci/prepare-linux-deps.sh browser
          node tests/review-browser.mjs
      - name: Package public preview
        run: |
          rm -rf deploy/out/tidebreak
          mkdir -p deploy/out/tidebreak
          cp -R dist/review deploy/out/tidebreak/review
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync('deploy/tidebreak-public.generated.json',JSON.stringify({
            name:'bloodline-tidebreak-public',
            main:'tidebreak-public-worker.mjs',
            compatibility_date:'2026-09-07',
            workers_dev:true,
            preview_urls:false,
            assets:{directory:'out/tidebreak',binding:'ASSETS',run_worker_first:true,not_found_handling:'none'}
          },null,2));
          JS
      - name: Deploy public URL and verify anonymous access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          deploy/node_modules/.bin/wrangler deploy --config deploy/tidebreak-public.generated.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          if(!account||!token)throw Error('Cloudflare deployment credentials unavailable');
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/subdomain`,{headers:{Authorization:`Bearer ${token}`}});
          const j=await r.json();
          if(!j.success||!j.result?.subdomain)throw Error('Cannot resolve workers.dev subdomain');
          const base=`https://bloodline-tidebreak-public.${j.result.subdomain}.workers.dev`;
          const paths=['/review/combat?skill=4001&enemy=soldier','/review/skills?skill=4001','/review/enemies?enemy=soldier'];
          for(const path of paths){
            let ok=false,last='';
            for(let i=0;i<12;i++){
              const res=await fetch(base+path,{redirect:'follow'});last=`${res.status} ${res.url}`;
              if(res.ok){ok=true;break;}
              await new Promise(resolve=>setTimeout(resolve,2500));
            }
            if(!ok)throw Error(`Anonymous public check failed: ${path} ${last}`);
          }
          const combat=base+'/review/combat?skill=4001&enemy=soldier';
          console.log('PUBLIC_URL='+combat);
          if(process.env.GITHUB_STEP_SUMMARY)fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`## Tidebreak public preview\n\n${combat}\n\nAnonymous access verified.\n`);
          JS
