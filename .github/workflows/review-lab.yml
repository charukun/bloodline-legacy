name: Review Lab Preview
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: review-lab-${{ github.event.pull_request.number || 'develop' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}
jobs:
  build:
    name: Build exact Review revision
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REVIEW_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'dev' }}
      REVIEW_PR: ${{ github.event.pull_request.number }}
      REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.REVIEW_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tools/build-review-lab.mjs
      - run: node --test tests/review-lab.test.mjs tests/review-worker.test.mjs tests/review-ui.test.mjs
      - run: npm ci --prefix deploy --ignore-scripts --no-audit --no-fund
      - run: bash tools/ci/prepare-linux-deps.sh browser
      - name: Verify exact-head Review in desktop and mobile browsers
        run: node tests/review-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-browser-${{ env.REVIEW_SHA }}
          path: deploy/evidence/review-browser/
          retention-days: 7
      - name: Package Review assets
        run: |
          mkdir -p deploy/out/review
          cp -R dist/review deploy/out/review/review
      - uses: actions/upload-artifact@v4
        with:
          name: review-${{ env.REVIEW_SHA }}
          path: deploy/out/review/
          retention-days: 7
          if-no-files-found: error
  publish:
    name: Publish isolated Review URL
    needs: build
    # Fork code is tested without deployment credentials. Never pull_request_target.
    if: >-
      vars.CICD_ENABLED_DEV == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REVIEW_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'dev' }}
      REVIEW_PR: ${{ github.event.pull_request.number }}
      REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.REVIEW_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: review-${{ env.REVIEW_SHA }}
          path: deploy/out/review/
      - run: npm ci --prefix deploy --ignore-scripts --no-audit --no-fund
      - name: Deploy and verify authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          WRANGLER_SEND_METRICS: 'false'
        run: node deploy/publish-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-links-${{ env.REVIEW_SHA }}
          path: deploy/evidence/review-published.json
          retention-days: 7
  cleanup:
    name: Remove closed PR previews
    if: >-
      github.event.action == 'closed' && vars.CICD_ENABLED_DEV == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Delete only this closed PR's Review workers
        env:
          REVIEW_PR: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node deploy/cleanup-review.mjs
